<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="398" viewBox="0 0 1040 398" role="img" aria-labelledby="title desc">
  <title id="title">Local GPU testing with CPU-only verification</title>
  <desc id="desc">A local GPU run records tests, source inputs, and outcomes and signs a receipt. The committed receipt travels to CPU-only CI for signature, source, outcome, and policy checks. Local execution and metadata are self-reported by the signer.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607083"/></marker></defs>
  <rect width="1040" height="398" rx="12" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#1a1d25">
    <rect x="24" y="30" width="330" height="326" rx="12" fill="#fff7ee" stroke="#bb6b32" stroke-dasharray="6 5" stroke-width="1.5"/>
    <text x="44" y="62" fill="#925126" font-size="13" font-weight="700" letter-spacing="1">LOCAL OR LAB GPU</text>
    <text x="44" y="99" font-size="23" font-weight="700">Run, record, and sign</text>
    <text x="44" y="142" font-size="18" font-weight="700">1  Run marked pytest tests</text>
    <text x="66" y="166" font-size="16" fill="#4b5060">Keep your numerical assertions.</text>
    <text x="44" y="209" font-size="18" font-weight="700">2  Record the code and results</text>
    <text x="66" y="233" font-size="16" fill="#4b5060">Fingerprint, tests, outcomes, time.</text>
    <text x="44" y="276" font-size="18" font-weight="700">3  Sign with an SSH key</text>
    <text x="66" y="300" font-size="16" fill="#4b5060">Attest to this run and source state.</text>
    <text x="44" y="336" font-size="13" fill="#925126">Trust boundary · self-reported by the signer</text>
    <path d="M354 210H398" stroke="#607083" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="403" y="153" width="214" height="114" rx="12" fill="#f2eff9" stroke="#c4b8dd"/>
    <text x="510" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#675584" letter-spacing="1">COMMIT THE RECEIPT</text>
    <text x="510" y="217" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700">gpu-proof.json</text>
    <text x="510" y="245" text-anchor="middle" font-size="15" fill="#4b5060">Signed, reviewable artifact</text>
    <path d="M618 210H665" stroke="#607083" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="672" y="30" width="344" height="326" rx="12" fill="#eaf3ef" stroke="#b7d6c8"/>
    <text x="694" y="62" fill="#087c58" font-size="13" font-weight="700" letter-spacing="1">CPU-ONLY CI</text>
    <text x="694" y="99" font-size="23" font-weight="700">Verify on each CI run</text>
    <text x="694" y="145" font-size="18" font-weight="700">Signature and signer</text>
    <text x="694" y="169" font-size="16" fill="#4b5060">Current public SSH keys on GitHub.</text>
    <text x="694" y="211" font-size="18" font-weight="700">Source and outcomes</text>
    <text x="694" y="235" font-size="16" fill="#4b5060">Fingerprint, ancestry, tests, skips.</text>
    <text x="694" y="277" font-size="18" font-weight="700">Repository policy</text>
    <text x="694" y="301" font-size="16" fill="#4b5060">Freshness, source scope, signer rules.</text>
    <text x="694" y="336" font-size="13" fill="#087c58">No GPU computation is rerun here.</text>
    <text x="520" y="382" text-anchor="middle" font-size="14" fill="#4b5060">A verified receipt authenticates an attestation. It does not prove GPU execution.</text>
  </g>
</svg>
